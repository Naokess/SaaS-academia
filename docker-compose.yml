services:
  postgres:
    image: postgres:16-alpine
    container_name: saas_academia_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: saas
      POSTGRES_PASSWORD: saas_dev_password
      POSTGRES_DB: saas_academia
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saas -d saas_academia"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: saas_academia_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      # "postgres" = nome do serviço acima (rede interna do compose) — NÃO localhost
      DATABASE_URL: postgresql://saas:saas_dev_password@postgres:5432/saas_academia
      # pega o AUTH_SECRET do .env do projeto (o compose interpola de lá)
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_TRUST_HOST: "true"
      NODE_ENV: production
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata: